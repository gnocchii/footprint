name: Footprint
options:
  deploymentTarget:
    macOS: "14.0"
  bundleIdPrefix: com.melody
  xcodeVersion: "16.0"

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift.git
    from: "7.0.0"

targets:
  Footprint:
    type: application
    platform: macOS
    sources:
      - Footprint
    settings:
      base:
        INFOPLIST_FILE: Footprint/Info.plist
        CODE_SIGN_ENTITLEMENTS: Footprint/Footprint.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.melody.footprint
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        CODE_SIGN_IDENTITY: "-"
        PRODUCT_NAME: Footprint
    dependencies:
      - package: GRDB
